[project]
name = "dataset-project"
version = "0.1.0"
description = "Deterministic GitHub-to-Hugging-Face dataset pipeline"
requires-python = ">=3.12"
dependencies = [
  "huggingface-hub>=0.30",
  "jsonschema>=4.23",
  "pyarrow>=18",
]

[project.optional-dependencies]
dev = [
  "datasets>=4",
  "pytest>=8.3",
  "ruff>=0.12",
]

[project.scripts]
dataset = "dataset_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataset_pipeline"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
